{% from '_icons.html' import icon %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} | NewsHub</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'light';if(localStorage.getItem('collapsed')==='1')document.documentElement.classList.add('pre-collapsed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body data-page="{{ page }}">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">N</div><div class="brand-t label"><b>NewsHub</b><span>Smart news aggregator</span></div>
    <button class="icon-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">{{ icon('left') }}</button></div>
  <nav>{% for key,(path,label,ic) in NAV.items() %}
    <a href="{{ path }}" class="{{ 'active' if key==page }}" title="{{ label }}">{{ icon(ic) }}<span class="label">{{ label }}</span></a>{% endfor %}</nav>
  <div class="side-foot label">DAA project · Trie, Graph, BFS, DFS</div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu">{{ icon('menu') }}</button>
    <h1>{{ title }}</h1>
    <form class="top-search" action="/search" method="get"><input name="q" type="search" placeholder="Search news…" aria-label="Search news"></form>
    <button class="btn" id="refreshBtn" title="Fetch the latest articles from all active sources">{{ icon('refresh') }}<span class="hide-sm">Refresh news</span></button>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">{{ icon('moon') }}</button>
    <div class="avatar" title="NewsHub">NH</div>
  </header>
  <main class="content">{% block content %}{% endblock %}</main>
</div>
<div id="toasts"></div>
<script>window.CATS={{ CATS|tojson }};</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
